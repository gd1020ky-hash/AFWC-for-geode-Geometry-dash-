name: Build Frame Forge

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  portable-tests:
    name: Portable C++ tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile and run tests
        run: |
          g++ -std=c++20 -Wall -Wextra -pedantic -Isrc tests/core_tests.cpp -o core_tests
          ./core_tests

  build-android64:
    name: Build Android 64-bit mod
    runs-on: ubuntu-latest
    needs: portable-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Frame-Forge-Android64
          path: ${{ steps.build.outputs.build-output }}
          
